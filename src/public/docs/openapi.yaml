      responses:
        200:
          description: 'IBAN generado correctamente'
          content:
            application/json:
              schema:
                type: object
                example:
                  iban: ES7921000813610123456789
                  formatted: 'ES79 2100 0813 6101 2345 6789'
                  components:
                    country: ES
                    check_digits: '79'
                    bank_code: '2100'
                    branch_code: '0813'
                    control_digits: '61'
                    account_number: '0123456789'
                properties:
                  iban:
                    type: string
                    example: ES7921000813610123456789
                  formatted:
                    type: string
                    example: 'ES79 2100 0813 6101 2345 6789'
                  components:
                    type: object
                    properties:
                      country:
                        type: string
                        example: ES
                      check_digits:
                        type: string
                        example: '79'
                      bank_code:
                        type: string
                        example: '2100'
                      branch_code:
                        type: string
                        example: '0813'
                      control_digits:
                        type: string
                        example: '61'
                      account_number:
                        type: string
                        example: '0123456789'
        401:
          description: ''
          content:
