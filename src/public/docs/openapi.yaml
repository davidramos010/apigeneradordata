openapi: 3.0.3
info:
  title: 'GeneradorData API Documentation'
  description: ''
  version: 1.0.0
servers:
  -
    url: 'http://localhost:8001'
tags:
  -
    name: '1. Authentication'
    description: ''
  -
    name: '2. Document Generation'
    description: ''
  -
    name: '3. Product Management'
    description: ''
  -
    name: '4. Financial Data'
    description: "\nEndpoints for generating and validating Spanish financial and banking data."
  -
    name: '5. CUPS'
    description: ''
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'You can retrieve your token by logging in.'
security:
  -
    default: []
paths:
  /api/login:
    post:
      summary: 'Login a user.'
      operationId: loginAUser
      description: ''
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                properties:
                  token:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        429:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Daily API request limit exceeded.'
                  limit: 1000
                  used: 1000
                  resets_at: '2026-08-25T00:00:00+00:00'
                properties:
                  message:
                    type: string
                    example: 'Daily API request limit exceeded.'
                  limit:
                    type: integer
                    example: 1000
                  used:
                    type: integer
                    example: 1000
                  resets_at:
                    type: string
                    example: '2026-08-25T00:00:00+00:00'
      tags:
        - '1. Authentication'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'The email of the user.'
                  example: user@example.com
                password:
                  type: string
                  description: 'The password of the user.'
                  example: secret
              required:
                - email
                - password
      security: []
  /api/register:
    post:
      summary: 'Register a new user.'
      operationId: registerANewUser
      description: ''
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'User registered successfully'
                properties:
                  message:
                    type: string
                    example: 'User registered successfully'
        422:
          description: ''
          content:
            text/plain:
              schema:
                type: string
                example: "{\n  \"message\": \"Validation error\",\n  \"errors\": {\n   \"email\": [\n    \"The email has already been taken.\"\n  ]\n}     * }"
        429:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Daily registration limit exceeded for this IP address.'
                  limit: 1000
                  used: 1000
                  resets_at: '2026-08-25T00:00:00+00:00'
                properties:
                  message:
                    type: string
                    example: 'Daily registration limit exceeded for this IP address.'
                  limit:
                    type: integer
                    example: 1000
                  used:
                    type: integer
                    example: 1000
                  resets_at:
                    type: string
                    example: '2026-08-25T00:00:00+00:00'
      tags:
        - '1. Authentication'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'The name of the user.'
                  example: 'John Doe'
                email:
                  type: string
                  description: 'The email of the user.'
                  example: user@example.com
                password:
                  type: string
                  description: 'The password of the user.'
                  example: secret
                password_confirmation:
                  type: string
                  description: 'The password confirmation.'
                  example: secret
              required:
                - name
                - email
                - password
                - password_confirmation
      security: []
  /api/me:
    get:
      summary: 'Get the authenticated user.'
      operationId: getTheAuthenticatedUser
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthorized
                properties:
                  message:
                    type: string
                    example: Unauthorized
      tags:
        - '1. Authentication'
  /api/logout:
    post:
      summary: 'finalice session'
      operationId: finaliceSession
      description: ''
      parameters: []
      responses: {  }
      tags:
        - '1. Authentication'
  /api/generate-dni:
    get:
      summary: 'Generate a random document number.'
      operationId: generateARandomDocumentNumber
      description: "Permission: Only authenticated users can access this endpoint.\nthis endpoint generates a random DNI (Documento Nacional de Identidad) number, which is a unique identifier used in Spain for individuals. The generated DNI consists of 8 digits followed by a letter, and it is commonly used for identification purposes in various administrative and legal processes.\nThe \"result\" query parameter allows the user to specify how many DNI numbers to generate, with a default value of 1 and a maximum limit of 20. The generated DNI numbers are returned as a JSON array in the response."
      parameters:
        -
          in: query
          name: result
          description: 'The number of DNI numbers to generate. Default: 1. Min: 1. Max: 20.'
          example: 17
          required: false
          schema:
            type: integer
            description: 'The number of DNI numbers to generate. Default: 1. Min: 1. Max: 20.'
            example: 17
      responses:
        200:
          description: ''
          content:
            text/plain:
              schema:
                type: string
                example: "{\n [\"12345678A\", \"87654321B\"]\n}"
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
        429:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Daily API request limit exceeded.'
                  limit: 1000
                  used: 1000
                  resets_at: '2026-08-25T00:00:00+00:00'
                properties:
                  message:
                    type: string
                    example: 'Daily API request limit exceeded.'
                  limit:
                    type: integer
                    example: 1000
                  used:
                    type: integer
                    example: 1000
                  resets_at:
                    type: string
                    example: '2026-08-25T00:00:00+00:00'
        500:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Internal Server Error'
                properties:
                  message:
                    type: string
                    example: 'Internal Server Error'
      tags:
        - '2. Document Generation'
  /api/generate-cif:
    get:
      summary: 'Generate random CIF numbers.'
      operationId: generateRandomCIFNumbers
      description: "Permission: Only authenticated users can access this endpoint.\nThis endpoint generates one or more random CIF (Código de Identificación Fiscal) numbers based on the \"result\" parameter.\nThe \"result\" parameter specifies how many CIFs to generate (default: 1, minimum: 1, maximum: 20)."
      parameters:
        -
          in: query
          name: result
          description: 'The number of CIFs to generate. Default: 1. Min: 1. Max: 20.'
          example: 17
          required: false
          schema:
            type: integer
            description: 'The number of CIFs to generate. Default: 1. Min: 1. Max: 20.'
            example: 17
      responses:
        200:
          description: ''
          content:
            text/plain:
              schema:
                type: string
                example: "{\n  [\"A12345678\", \"B87654321\"]\n}"
        400:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'The result parameter must be between 1 and 20.'
                properties:
                  message:
                    type: string
                    example: 'The result parameter must be between 1 and 20.'
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
        500:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Internal Server Error'
                properties:
                  message:
                    type: string
                    example: 'Internal Server Error'
      tags:
        - '2. Document Generation'
  /api/generate-nie:
    get:
      summary: 'Generate random NIE numbers.'
      operationId: generateRandomNIENumbers
      description: "Permission: Only authenticated users can access this endpoint.\nThis endpoint generates one or more random NIE (Número de Identidad de Extranjero) numbers,\nwhich are unique identifiers used in Spain for foreign residents. Each NIE consists of an\ninitial letter (X, Y or Z), seven digits and a control letter (e.g. X1234567A).\nThe \"result\" parameter controls how many NIEs are generated (default: 1, min: 1, max: 20)."
      parameters:
        -
          in: query
          name: result
          description: 'The number of NIEs to generate. Default: 1. Min: 1. Max: 20.'
          example: 2
          required: false
          schema:
            type: integer
            description: 'The number of NIEs to generate. Default: 1. Min: 1. Max: 20.'
            example: 2
      responses:
        200:
          description: ''
          content:
            text/plain:
              schema:
                type: string
                example: "{\n  [\"X1234567A\", \"Y7654321B\"]\n}"
        400:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'The result parameter must be between 1 and 20.'
                properties:
                  message:
                    type: string
                    example: 'The result parameter must be between 1 and 20.'
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
        500:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Internal Server Error'
                properties:
                  message:
                    type: string
                    example: 'Internal Server Error'
      tags:
        - '2. Document Generation'
  /api/generate-nif:
    get:
      summary: 'Generate random NIF numbers.'
      operationId: generateRandomNIFNumbers
      description: "Permission: Only authenticated users can access this endpoint.\nThis endpoint generates one or more random NIF (Número de Identificación Fiscal) numbers,\nwhich are unique identifiers used in Spain for tax purposes. Each NIF consists of 8 digits\nfollowed by a control letter (e.g. 12345678A).\nThe \"result\" parameter controls how many NIFs are generated (default: 1, min: 1, max: 20)."
      parameters:
        -
          in: query
          name: result
          description: 'The number of NIFs to generate. Default: 1. Min: 1. Max: 20.'
          example: 2
          required: false
          schema:
            type: integer
            description: 'The number of NIFs to generate. Default: 1. Min: 1. Max: 20.'
            example: 2
      responses:
        200:
          description: ''
          content:
            text/plain:
              schema:
                type: string
                example: "{\n  [\"12345678A\", \"87654321B\"]\n}"
        400:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'The result parameter must be between 1 and 20.'
                properties:
                  message:
                    type: string
                    example: 'The result parameter must be between 1 and 20.'
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
        500:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Internal Server Error'
                properties:
                  message:
                    type: string
                    example: 'Internal Server Error'
      tags:
        - '2. Document Generation'
  /api/generate-ssn:
    get:
      summary: 'Generate random SSN numbers.'
      operationId: generateRandomSSNNumbers
      description: "Permission: Only authenticated users can access this endpoint.\nThis endpoint generates one or more random SSN (Social Security Number) numbers,\nwhich are unique identifiers used in the United States for social security purposes.\nEach SSN follows the format AAA-BB-CCCC (e.g. 123-45-6789).\nThe \"result\" parameter controls how many SSNs are generated (default: 1, min: 1, max: 20)."
      parameters:
        -
          in: query
          name: result
          description: 'The number of SSNs to generate. Default: 1. Min: 1. Max: 20.'
          example: 2
          required: false
          schema:
            type: integer
            description: 'The number of SSNs to generate. Default: 1. Min: 1. Max: 20.'
            example: 2
      responses:
        200:
          description: ''
          content:
            text/plain:
              schema:
                type: string
                example: "{\n  [\"123-45-6789\", \"987-65-4321\"]\n}"
        400:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'The result parameter must be between 1 and 20.'
                properties:
                  message:
                    type: string
                    example: 'The result parameter must be between 1 and 20.'
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
        500:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Internal Server Error'
                properties:
                  message:
                    type: string
                    example: 'Internal Server Error'
      tags:
        - '2. Document Generation'
  /api/generate-cif-by-type:
    get:
      summary: 'Generate random CIF numbers by type.'
      operationId: generateRandomCIFNumbersByType
      description: "Permission: Only authenticated users can access this endpoint.\nThis endpoint generates one or more random CIF (Código de Identificación Fiscal) numbers\nfiltered by entity type. The \"type\" parameter determines the category of the CIF, and\n\"result\" controls how many are generated (default: 1, min: 1, max: 20).\n\n**Sociedades Mercantiles y de Capital**\n- `A`: Sociedades Anónimas (S.A.).\n- `B`: Sociedades de Responsabilidad Limitada (S.L. o S.R.L.).\n- `C`: Sociedades Colectivas.\n- `D`: Sociedades Comanditarias.\n\n**Entidades Sociales, Civiles y Sin Personalidad Jurídica**\n- `E`: Comunidades de bienes, herencias yacentes y otras entidades sin personalidad jurídica.\n- `F`: Sociedades Cooperativas.\n- `G`: Asociaciones y Fundaciones.\n- `H`: Comunidades de propietarios en régimen de propiedad horizontal.\n- `J`: Sociedades Civiles (con o sin personalidad jurídica).\n- `U`: Uniones Temporales de Empresas (UTE).\n- `V`: Otros tipos de entidades no definidos en el resto de claves.\n\n**Administración y Entidades Públicas**\n- `P`: Corporaciones Locales (Ayuntamientos, Diputaciones).\n- `Q`: Organismos públicos.\n- `S`: Órganos de la Administración del Estado y de las Comunidades Autónomas.\n\n**Entidades Religiosas y Extranjeras**\n- `R`: Congregaciones e instituciones religiosas.\n- `N`: Entidades extranjeras (empresas internacionales que operan en España sin domicilio social aquí).\n- `W`: Establecimientos permanentes de entidades no residentes en España.\n\n**Personas Físicas Especiales (sin DNI ni NIE)**\n- `K`: Personas físicas españolas menores de 14 años, residentes en España sin DNI.\n- `L`: Personas físicas españolas no residentes en España y sin DNI.\n- `M`: Personas físicas extranjeras que carecen de NIE."
      parameters:
        -
          in: query
          name: result
          description: 'The number of CIFs to generate. Default: 1. Min: 1. Max: 20.'
          example: 3
          required: false
          schema:
            type: integer
            description: 'The number of CIFs to generate. Default: 1. Min: 1. Max: 20.'
            example: 3
        -
          in: query
          name: type
          description: 'The entity type of the CIF to generate. Valid values: A, B, C, D, E, F, G, H, J, K, L, M, N, P, Q, R, S, U, V, W. Default: A.'
          example: B
          required: false
          schema:
            type: string
            description: 'The entity type of the CIF to generate. Valid values: A, B, C, D, E, F, G, H, J, K, L, M, N, P, Q, R, S, U, V, W. Default: A.'
            example: B
      responses:
        200:
          description: ''
          content:
            text/plain:
              schema:
                type: string
                example: "{\n  [\"B12345678\", \"B87654321\", \"B11223344\"]\n}"
        400:
          description: ''
          content:
            application/json:
              schema:
                oneOf:
                  -
                    description: 'Invalid result'
                    type: object
                    example:
                      message: 'The result parameter must be between 1 and 20.'
                    properties:
                      message:
                        type: string
                        example: 'The result parameter must be between 1 and 20.'
                  -
                    description: 'Invalid type'
                    type: object
                    example:
                      message: 'Invalid type parameter. Valid types are: A, B, C, D, E, F, G, H, J, K, L, M, N, P, Q, R, S, U, V, W.'
                    properties:
                      message:
                        type: string
                        example: 'Invalid type parameter. Valid types are: A, B, C, D, E, F, G, H, J, K, L, M, N, P, Q, R, S, U, V, W.'
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
        500:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Internal Server Error'
                properties:
                  message:
                    type: string
                    example: 'Internal Server Error'
      tags:
        - '2. Document Generation'
  /api/validate-document:
    get:
      summary: 'Validate a document number.'
      operationId: validateADocumentNumber
      description: "Permission: Only authenticated users can access this endpoint.\nThis endpoint validates a document string and returns whether it is valid or not.\nIf the optional \"type\" parameter is omitted, the system auto-detects the document type\nby trying each known format in order: NIE → CIF → DNI → SSN → PASAPORTE.\nIf \"type\" is provided, only that specific format is evaluated.\n\nSupported types:\n- `DNI`: Documento Nacional de Identidad (8 digits + control letter).\n- `NIF`: Número de Identificación Fiscal — same algorithm as DNI for individuals.\n- `NIE`: Número de Identidad de Extranjero (X/Y/Z + 7 digits + control letter).\n- `CIF`: Código de Identificación Fiscal (entity letter + 7 digits + control character).\n- `SSN`: Social Security Number — 8 digits or AAA-BB-CCCC format.\n- `PASAPORTE`: Spanish passport — 2 or 3 letters followed by 6 digits."
      parameters:
        -
          in: query
          name: document
          description: 'The document string to validate.'
          example: 12345678Z
          required: true
          schema:
            type: string
            description: 'The document string to validate.'
            example: 12345678Z
        -
          in: query
          name: type
          description: 'The document type to validate against. If omitted, auto-detection is used. Valid values: DNI, NIF, NIE, CIF, SSN, PASAPORTE.'
          example: DNI
          required: false
          schema:
            type: string
            description: 'The document type to validate against. If omitted, auto-detection is used. Valid values: DNI, NIF, NIE, CIF, SSN, PASAPORTE.'
            example: DNI
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                oneOf:
                  -
                    description: 'Valid document (auto-detect)'
                    type: object
                    example:
                      document: 12345678Z
                      type: DNI
                      message: VALIDO
                    properties:
                      document:
                        type: string
                        example: 12345678Z
                      type:
                        type: string
                        example: DNI
                      message:
                        type: string
                        example: VALIDO
                  -
                    description: 'Invalid document (auto-detect)'
                    type: object
                    example:
                      document: 00000000X
                      type: null
                      message: INVALIDO
                    properties:
                      document:
                        type: string
                        example: 00000000X
                      type:
                        type: string
                        example: null
                        nullable: true
                      message:
                        type: string
                        example: INVALIDO
                  -
                    description: 'Valid document (explicit type)'
                    type: object
                    example:
                      document: X1234567L
                      type: NIE
                      message: VALIDO
                    properties:
                      document:
                        type: string
                        example: X1234567L
                      type:
                        type: string
                        example: NIE
                      message:
                        type: string
                        example: VALIDO
                  -
                    description: 'Invalid document (explicit type)'
                    type: object
                    example:
                      document: X1234567L
                      type: DNI
                      message: INVALIDO
                    properties:
                      document:
                        type: string
                        example: X1234567L
                      type:
                        type: string
                        example: DNI
                      message:
                        type: string
                        example: INVALIDO
        400:
          description: ''
          content:
            application/json:
              schema:
                oneOf:
                  -
                    description: 'Missing document'
                    type: object
                    example:
                      message: 'The document parameter is required.'
                    properties:
                      message:
                        type: string
                        example: 'The document parameter is required.'
                  -
                    description: 'Invalid type'
                    type: object
                    example:
                      message: 'Invalid type. Valid types: DNI, NIF, NIE, CIF, SSN, PASAPORTE.'
                    properties:
                      message:
                        type: string
                        example: 'Invalid type. Valid types: DNI, NIF, NIE, CIF, SSN, PASAPORTE.'
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
        500:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Internal Server Error'
                properties:
                  message:
                    type: string
                    example: 'Internal Server Error'
      tags:
        - '2. Document Generation'
  /api/products:
    get:
      summary: 'Retrieve all products from the database.'
      operationId: retrieveAllProductsFromTheDatabase
      description: "Only users with the 'Admin' role can access this endpoint.\nPermission: Only users with the 'Admin' role can access this endpoint. --- IGNORE ---\nThis endpoint retrieves all products from the database and returns them as a JSON response. If no products are found, it returns a 404 response with a message indicating that no products were found."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      example: 1
                    name:
                      type: string
                      example: Laptop
                    price:
                      type: number
                      example: 999.99
                    created_at:
                      type: string
                      example: '2024-06-01T12:00:00Z'
                    updated_at:
                      type: string
                      example: '2024-06-01T12:00:00Z'
                example:
                  -
                    id: 1
                    name: Laptop
                    price: 999.99
                    created_at: '2024-06-01T12:00:00Z'
                    updated_at: '2024-06-01T12:00:00Z'
        404:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'No products found'
                properties:
                  message:
                    type: string
                    example: 'No products found'
      tags:
        - '3. Product Management'
  /api/product:
    post:
      summary: 'Add a new product to the database.'
      operationId: addANewProductToTheDatabase
      description: "Solo los usuarios con el rol 'admin' pueden acceder a este endpoint.\nEste endpoint permite a los usuarios con el rol 'admin' agregar un nuevo producto a la base de datos. El producto debe tener un nombre que sea una cadena de texto entre 10 y 100 caracteres, y un precio que sea un valor numérico. Si el producto se agrega correctamente, se devuelve un mensaje de éxito. Si la validación falla, se devuelve un mensaje de error con los detalles de la validación."
      parameters: []
      responses:
        201:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Product added successfully'
                properties:
                  message:
                    type: string
                    example: 'Product added successfully'
        422:
          description: ''
          content:
            text/plain:
              schema:
                type: string
                example: "{\n  \"message\": \"Validation error\",\n  \"errors\": {\n   \"name\": [\n    \"The name field is required.\"\n  ],\n  \"price\": [\n    \"The price field is required.\"\n  ]\n}     * }"
        429:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Daily API request limit exceeded.'
                  limit: 1000
                  used: 1000
                  resets_at: '2026-08-25T00:00:00+00:00'
                properties:
                  message:
                    type: string
                    example: 'Daily API request limit exceeded.'
                  limit:
                    type: integer
